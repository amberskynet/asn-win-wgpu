[package]
name = "asn-winit"
version = "0.1.0"
edition = "2024"

[dependencies]
winit = { version = "0.30" }
asn-gui-core = { path = "../asn-gui-core" }
asn-logger = { git = "https://github.com/amberskynet/asn-logger.git", version = "3.1.0" }
asn-core = { path = "../asn-core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "Node",
    "Window",
] }
