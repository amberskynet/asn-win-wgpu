[package]
name = "asn-wgpu"
version = "0.1.0"
edition = "2024"

[dependencies]
winit = { version = "0.30" }
asn-logger = { git = "https://github.com/amberskynet/asn-logger.git", version = "2.1.1", features = [] }
thiserror = "1.0"
anyhow = "1.0.98"
bytemuck = { version = "1.16", features = [ "derive" ] }
rand = "0.9.2"

[dependencies.image]
version = "0.24"
default-features = false
features = ["png", "jpeg"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "26.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "26.0", default-features = false, features = [
    "wgsl",
    "webgl"
    #    "dx12",
    #    "metal",
    #    "webgpu",
] }
