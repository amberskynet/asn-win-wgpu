[package]
name = "tokio-worker-pool"
version = "0.1.0"
edition = "2024"

[dependencies]
asn-core = { path = "../../modules/asn-core" }
asn-core-bus = { path = "../../modules/asn-core-bus" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
