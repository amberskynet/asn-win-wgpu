<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASN Web WGPU</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .canvas-container {
            margin: 20px 0;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 400px;
            background: #1a1a1a;
        }
        
        .controls {
            margin: 20px 0;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        button {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 5px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .status {
            margin: 20px 0;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            font-family: monospace;
        }
        
        .loading {
            display: none;
            margin: 20px 0;
        }
        
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 ASN Web WGPU</h1>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Loading WebAssembly module...</p>
        </div>
        
        <div class="canvas-container">
            <canvas id="canvas" width="800" height="600"></canvas>
        </div>
        
        <div class="controls">
            <button onclick="initApp()">Initialize App</button>
            <button onclick="greetUser()">Greet User</button>
            <button onclick="clearCanvas()">Clear Canvas</button>
        </div>
        
        <div class="status" id="status">
            Status: Ready to initialize
        </div>
    </div>

    <script type="module">
        import init, { init_web_app, greet } from './pkg/asn_win_wgpu.js';
        
        let wasmModule = null;
        
        async function loadWasm() {
            try {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('status').textContent = 'Status: Loading WebAssembly module...';
                
                wasmModule = await init();
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('status').textContent = 'Status: WebAssembly module loaded successfully!';
                
                console.log('WASM module loaded:', wasmModule);
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('status').textContent = `Status: Error loading WASM module - ${error.message}`;
                console.error('Error loading WASM module:', error);
            }
        }
        
        window.initApp = async function() {
            if (!wasmModule) {
                document.getElementById('status').textContent = 'Status: Please wait for WASM module to load';
                return;
            }
            
            try {
                document.getElementById('status').textContent = 'Status: Initializing application...';
                await init_web_app();
                document.getElementById('status').textContent = 'Status: Application initialized successfully!';
            } catch (error) {
                document.getElementById('status').textContent = `Status: Error initializing app - ${error.message}`;
                console.error('Error initializing app:', error);
            }
        };
        
        window.greetUser = function() {
            if (!wasmModule) {
                document.getElementById('status').textContent = 'Status: Please wait for WASM module to load';
                return;
            }
            
            try {
                const message = greet('Web User');
                document.getElementById('status').textContent = `Status: ${message}`;
                console.log('Greeting:', message);
            } catch (error) {
                document.getElementById('status').textContent = `Status: Error greeting - ${error.message}`;
                console.error('Error greeting:', error);
            }
        };
        
        window.clearCanvas = function() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('status').textContent = 'Status: Canvas cleared';
        };
        
        // Load WASM module when page loads
        loadWasm();
    </script>
</body>
</html>
