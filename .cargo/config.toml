[build]
# Enable incremental compilation for faster rebuilds
incremental = true

[profile.dev]
# Optimize for faster compilation
opt-level = 0
debug = true
# Enable debug assertions
debug-assertions = true
# Enable overflow checks
overflow-checks = true

[profile.release]
# Optimize for performance
opt-level = 3
# Enable link-time optimization
lto = true
# Reduce codegen units for better optimization
codegen-units = 1
# Enable panic = abort for smaller binaries
panic = "abort"
# Disable debug assertions in release
debug-assertions = false
# Disable overflow checks in release
overflow-checks = false

[profile.test]
# Optimize tests for speed
opt-level = 1
debug = true

[profile.bench]
# Optimize benchmarks for performance
opt-level = 3
debug = false
