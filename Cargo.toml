[package]
name = "asn-win-wgpu"
version = "0.1.0"
edition = "2024"
authors = ["Amberskynet Team"]
description = "Modern window system implementation using Winit + WGPU"
license = "MIT"
repository = "https://github.com/amberskynet/asn-win-wgpu"
keywords = ["wgpu", "winit", "graphics", "window", "rendering"]
categories = ["rendering", "gui"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
asn-logger = { git = "https://github.com/amberskynet/asn-logger.git", tag = "3.0.0", features = [
] }
asn-wgpu = { path = "./modules/asn-wgpu" }
asn-winit = { path = "./modules/asn-winit" }
asn-gui-core = { path = "./modules/asn-gui-core" }
wgpu-map = { path = "./modules/gui-elements/wgpu-map" }
pollster = "0.4"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
